# ──────────────────────────────────────────────────────────────────────────
# AGV Waypoints Configuration
# แก้ไขไฟล์นี้แล้วรัน agv_waypoint_node ใหม่ได้เลย (ไม่ต้อง colcon build)
#
# วิธีหาพิกัด (x, y, yaw):
#   1. เปิด RViz พร้อม Nav2
#   2. กด "Publish Point" บน toolbar แล้วคลิกบนแผนที่
#   3. รัน: ros2 topic echo /clicked_point  → อ่านค่า x, y
#   4. yaw (ทิศทางหัวหุ่นยนต์): 0.0=ตะวันออก  1.57=เหนือ  3.14=ตะวันตก  -1.57=ใต้
#
# เพิ่ม waypoint กลางทาง (dense waypoints) เพื่อบังคับเส้นทางที่ต้องการ:
#   เช่น A → mid1 → mid2 → B แทนที่จะเป็น A → B ตรงๆ
# ──────────────────────────────────────────────────────────────────────────

waypoints:
  - name: "A"
    x: -3.31337
    y:  0.979509
    yaw: 0.999846

  - name: "B"
    x:  0.79847
    y:  1.19823
    yaw: 9.0799e-07

  - name: "C"
    x: -1.2289
    y: -1.07362
    yaw: 0.630321
