# SLAM config สำหรับเก็บแผนที่พื้นที่กว้าง (โรงงาน) ด้วย RPLiDAR S2
# ใช้ไฟล์เดียวกันทั้งรอบ baseline (wheel) และรอบ EKF → เทียบผลของ odom ได้ตรง ๆ
# ค่าที่เปลี่ยนจาก mapper_params_s2.yaml มีป้าย [factory] กำกับ

slam_toolbox:
  ros__parameters:

    # ── Solver ────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── ROS Frames & Topics ───────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_filtered
    use_map_saver: true
    mode: mapping

    # ── Map Settings ──────────────────────────────────────────────────────
    map_file_name: ""
    map_start_at_dock: false
    resolution: 0.05               # ความละเอียดแผนที่ (เมตร/pixel)
    map_update_interval: 3.0       # [factory] แผนที่ใหญ่ใช้ CPU สูง → วาดแผนที่ห่างขึ้น (ไม่กระทบความแม่น)
    min_laser_range: 0.0           # ระยะ LiDAR ต่ำสุด (เมตร)
    max_laser_range: 25.0          # S2 วัดได้ ~30 m (ผิวขาว) เผื่อ margin ไว้ที่ 25 m
    min_pass_through: 2
    occupancy_threshold: 0.1

    # ── Timing ────────────────────────────────────────────────────────────
    transform_publish_period: 0.02
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    throttle_scans: 1
    enable_interactive_mode: true

    # ── Scan Matching ─────────────────────────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2   # เคลื่อนที่อย่างน้อย 0.2 m จึง update (AGV วิ่งช้า ~0.4 m/s)
    minimum_travel_heading: 0.15   # [factory] yaw จาก EKF เชื่อถือได้ → เก็บ scan ช่วงเลี้ยวถี่ขึ้น (~9 deg)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 20.0   # [factory] S2 มองไกล → ใช้ scan ไกลขึ้นช่วย matching
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ── Loop Closure ──────────────────────────────────────────────────────
    do_loop_closing: true
    loop_search_maximum_distance: 8.0   # [factory] สำคัญที่สุด: odom คลาดเกิน 3 m ตอนวนกลับ → ไม่ค้นหา loop closure → แผนที่ซ้อน
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation Search ────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Scan Matcher Penalties ────────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    stack_size_to_use: 40000000
    debug_logging: false
