# Nav2 params สำหรับชุด RPLiDAR S2 + IMU + EKF (copy จาก my_robot_bringup/config/nav2_params_agv.yaml)
# ค่าที่เปลี่ยนมีป้าย [s2] กำกับ — ที่เหลือ (RPP, footprint, costmap, พฤติกรรมหยุดรอ) คงเดิมทั้งหมด

amcl:
  ros__parameters:
    use_sim_time: false
    # [s2] โมเดลความคลาดเคลื่อนของ odom (เดิม 0.2 ทั้งสี่ = ค่าตั้งต้นของ AMCL) : odom ของหุ่นนี้ผ่าน EKF (แม่นกว่าตั้งต้น)
    #      ลดเหลือ 0.1 → อนุภาคกระจายน้อยลงตอนเคลื่อนที่ σ ของ AMCL โตช้าลง (ถ้าตำแหน่งแกว่ง/ไหลหลง ให้ลองกลับเป็น 0.2)
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan_filtered
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0             # [s2] ตรงกับระยะที่เชื่อถือได้ของ S2 และ SLAM config
    laser_min_range: -1.0
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # [s2] ใช้สแกนปรับตำแหน่งถี่ขึ้น (เดิม 0.2 rad / 0.25 m) → σ หดบ่อยขึ้น แลกกับ CPU ที่เพิ่มเล็กน้อย
    update_min_a: 0.1
    update_min_d: 0.1
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    tf_broadcast: true
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered   # [s2] อ่านความเร็วจาก EKF (แหล่งเดียวกับ TF odom→base_link)
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odometry/filtered   # [s2] RPP ใช้ความเร็วจริงคำนวณ lookahead → ใช้ค่าจาก EKF
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # รอ obstacle ได้นานสูงสุด 5 นาที ก่อนประกาศ failure
    failure_tolerance: 300.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # รอ obstacle ได้นาน 1 ชั่วโมง → recovery behaviors แทบไม่มีโอกาสทำงาน
      movement_time_allowance: 3600.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15    # [s2] เดิม 0.25 → หยุดใกล้เป้าขึ้น (AMCL+EKF แม่นพอ); ถ้ารถเลยเป้าแล้ววนกลับ ให้ขยับเป็น 0.15
      yaw_goal_tolerance: 0.10   # [s2] เดิม 0.25 (14 deg) → 5.7 deg; ยังมากกว่าระยะที่เลยตอนเบรก (~3-6 deg) จึงไม่แกว่ง

    # ── Regulated Pure Pursuit — ปรับสำหรับหุ่นยนต์ลากจูง ────────────────
    #
    # ระบบทั้งหมด: AMR (65×57.5cm) + Hook (37cm) + รถเข็น (65×44cm)
    # ความเร็วงาน: 0.2 m/s
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # ── ความเร็ว ──────────────────────────────────────────────────────
      desired_linear_vel: 0.2            # ความเร็วงานจริง (m/s)
      # ── Lookahead — ใหญ่ขึ้นเพื่อให้เลี้ยวโค้งนุ่มนวล ────────────────
      # รถลาก pivot ต้องการ lookahead ยาวขึ้นเพื่อไม่ให้หักหัวกะทันหัน
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # ── การชะลอเข้าเป้าหมาย ──────────────────────────────────────────
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      # ── หยุดอัตโนมัติเมื่อเจอ obstacle ──────────────────────────────
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      # ── ปรับความเร็วตามความโค้ง (ชะลอตอนเลี้ยว) ─────────────────────
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      # ── การหมุนหัว — ช้าลงเพื่อรถเข็นไม่กระชาก ─────────────────────
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.5  # ลดจาก 1.0 → หมุนนุ่มขึ้น
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 0.8             # ลดจาก 3.2 → เร่งหมุนนุ่มขึ้น
      allow_reversing: false
      transform_tolerance: 0.2
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# spin และ backup ต้องลงทะเบียนไว้เพื่อให้ bt_navigator โหลด BT XML ผ่าน
# แต่จะไม่ถูกเรียกใช้จริงเพราะ movement_time_allowance = 3600 วินาที
# (robot หยุดรอ obstacle ได้นาน 1 ชั่วโมงก่อนที่ recovery จะ kick in)
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # ── Footprint: AMR เท่านั้น (ทดสอบโดยไม่พ่วงรถเข็น) ───────────────
      # งานจริงพร้อมรถเข็น: "[[0.33, -0.32], [0.33, 0.32], [-1.40, 0.32], [-1.40, -0.32]]"
      footprint: "[[0.33, -0.29], [0.33, 0.29], [-0.33, 0.29], [-0.33, -0.29]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]   # [s2] ตัด obstacle_layer: global planner ไม่เห็นของกีดขวางชั่วคราว → ไม่อ้อม ให้ local costmap + RPP หยุดรอแทน
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # Footprint: AMR เท่านั้น (ทดสอบโดยไม่พ่วงรถเข็น)
      # งานจริงพร้อมรถเข็น: "[[0.33, -0.32], [0.33, 0.32], [-1.40, 0.32], [-1.40, -0.32]]"
      footprint: "[[0.33, -0.29], [0.33, 0.29], [-0.33, 0.29], [-0.33, -0.29]]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
