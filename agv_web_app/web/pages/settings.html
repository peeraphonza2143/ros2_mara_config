    <!-- ───────── Settings ───────── -->
    <section data-view="settings" class="view" hidden>
      <div class="card">
        <h2 data-i18n="ui.lang.label">Language</h2>
        <p class="muted" data-i18n="ui.settings.lang.hint">Choose the language used on every screen. Your choice is remembered on this device.</p>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">English</button>
          <button type="button" class="lang-btn" data-lang="th" aria-pressed="false">ไทย</button>
        </div>
      </div>
    </section>
